spring:
  application:
    name: moa

  datasource:
    url: jdbc:mysql://localhost:3306/moa?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Seoul
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    # data.sql 이 테이블 생성 뒤에 실행되도록 미룹니다.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 10

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
