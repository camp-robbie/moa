<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아 개발자 커뮤니티</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand" onclick="go('#/posts')">모<span>아</span></div>
    <nav class="tabs">
      <button id="tabAll" onclick="go('#/posts')">전체글</button>
      <button id="tabTimeline" class="hidden" onclick="go('#/timeline')">팔로잉</button>
    </nav>
    <div class="grow"></div>

    <div class="rel">
      <button id="bellBtn" class="iconbtn hidden" onclick="togglePop('popNoti')" aria-label="알림">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span id="bellDot" class="dot hidden">0</span>
      </button>
      <div id="popNoti" class="pop hidden">
        <div class="pophead">알림<span class="grow"></span>
          <button class="btn plain sm" onclick="readAllNoti()">모두 읽음</button></div>
        <div id="notiList" style="max-height:380px;overflow:auto"></div>
      </div>
    </div>

    <button id="msgBtn" class="iconbtn hidden" onclick="go('#/messages')" aria-label="쪽지">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
    </button>

    <button id="btnLogin" class="btn" onclick="go('#/login')">로그인</button>
    <div class="rel">
      <button id="meBtn" class="iconbtn hidden" onclick="togglePop('popMe')"><span id="meAvatar"></span></button>
      <div id="popMe" class="pop narrow hidden">
        <button class="popitem" onclick="go('#/messages');closePops()">쪽지함</button>
        <button class="popitem" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <button class="btn primary" onclick="go('#/write')">글쓰기</button>
  </div>
</header>

<div class="wrap">
  <main id="view"></main>
  <aside id="side"></aside>
</div>

<div class="toasts" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"></script>
<script src="/api.js"></script>
<script src="/app.js"></script>
</body>
</html>
